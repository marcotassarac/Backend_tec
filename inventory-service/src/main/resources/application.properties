server.port=8084

spring.application.name=inventory-service

spring.datasource.url=jdbc:h2:file:./data/inventory-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=ClaveSecretaSuperSeguraParaElProyectoGestorDeInventarioCambiarEnProduccion2026

app.cors.allowed-origins=http://localhost:3000
services.product-service.url=http://localhost:8083

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Un mensaje que lanza excepcion se rechaza sin reencolar y RabbitMQ lo deriva a la DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Kafka (productor de inventario.movimientos) ----------
# Los 3 brokers del docker-compose.kafka.yml; basta con que uno responda para descubrir el resto
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=inventory-service
# acks=all + idempotencia: el broker confirma solo cuando las replicas en sincronia (min.insync=2)
# tienen el evento, y los reintentos no generan duplicados
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
# Si Kafka esta caido, el registro del movimiento no queda bloqueado mas de 5 s
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
app.kafka.topics.movimientos=inventario.movimientos
