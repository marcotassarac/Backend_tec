server.port=8084

spring.application.name=inventory-service

spring.datasource.url=jdbc:h2:file:./data/inventory-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jwt.secret=ClaveSecretaSuperSeguraParaElProyectoGestorDeInventarioCambiarEnProduccion2026

app.cors.allowed-origins=http://localhost:3000
services.product-service.url=http://localhost:8083

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Un mensaje que lanza excepcion se rechaza sin reencolar y RabbitMQ lo deriva a la DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false
