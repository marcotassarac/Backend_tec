spring.application.name=product-service

spring.datasource.url=jdbc:h2:mem:product-test-db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=ClaveSecretaSuperSeguraParaElProyectoGestorDeInventarioCambiarEnProduccion2026

app.cors.allowed-origins=http://localhost:3000
services.category-service.url=http://localhost:8082

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Las pruebas no deben tocar el cluster Kafka local: sin auto-creacion de topicos ni listeners
spring.kafka.bootstrap-servers=localhost:19099
spring.kafka.admin.auto-create=false
app.kafka.topics.movimientos=inventario.movimientos
app.kafka.topics.alertas-stock=inventario.alertas-stock
app.kafka.listeners.auto-startup=false
