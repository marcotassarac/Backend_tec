server.port=8081

spring.application.name=auth-service

spring.datasource.url=jdbc:h2:file:./data/auth-db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clave compartida por los 5 microservicios para firmar/validar JWT (HS256, minimo 32 bytes)
jwt.secret=ClaveSecretaSuperSeguraParaElProyectoGestorDeInventarioCambiarEnProduccion2026
jwt.expiration-ms=28800000

app.cors.allowed-origins=http://localhost:3000
