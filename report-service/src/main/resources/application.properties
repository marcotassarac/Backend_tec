server.port=8085

spring.application.name=report-service

jwt.secret=ClaveSecretaSuperSeguraParaElProyectoGestorDeInventarioCambiarEnProduccion2026

app.cors.allowed-origins=http://localhost:3000
services.product-service.url=http://localhost:8083
services.inventory-service.url=http://localhost:8084

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Un mensaje que lanza excepcion se rechaza sin reencolar y RabbitMQ lo deriva a la DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Kafka (consumidor de inventario.movimientos, productor de inventario.alertas-stock) ----------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=report-service
# Un grupo nuevo empieza desde el primer evento disponible y el offset se confirma a mano (AckMode.RECORD)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
# Rebalanceo cooperativo: al entrar o salir un consumidor solo se mueven las particiones necesarias
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties.session.timeout.ms=15000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
app.kafka.topics.movimientos=inventario.movimientos
app.kafka.topics.alertas-stock=inventario.alertas-stock
app.kafka.listeners.concurrency=3
app.kafka.listeners.auto-startup=true
app.kafka.retry.intentos=3
app.kafka.retry.intervalo-ms=1000
